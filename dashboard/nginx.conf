server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events streams: disable buffering so events flush immediately.
    location /stream/ {
        proxy_pass http://auctioneer:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /auctions {
        proxy_pass http://auctioneer:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
