# HypeExchange stack.
#
#   docker compose up -d                 # infrastructure only (Kafka + Redis)
#   docker compose --profile full up     # ONE-COMMAND FULL DEMO: everything, then
#                                        # open http://localhost:8088
#
# Infra services (kafka, redis, kafka-init) have no profile so they always start.
# The application services are gated behind the "full" profile.

services:
  redis:
    image: redis:7-alpine
    container_name: hype-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: hype-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two broker listeners: PLAINTEXT (advertised as localhost) for host clients,
      # INTERNAL (advertised as kafka) for other containers on the compose network.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Pre-creates the firehose + metrics topics so the streams app finds its inputs.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: hype-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B=kafka:29092
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists --partitions 6 --replication-factor 1 --topic "$$1"; }
        create auction-results
        create impressions
        create clicks
        create invests
        create conversions
        create metrics-meme
        create metrics-bidder
        create attributed-clicks
        create metrics-attribution
        echo "topics ready"
    restart: "no"

  # ---- application services (only with `--profile full`) ----

  auctioneer:
    profiles: ["full"]
    build:
      context: .
      target: auctioneer
    container_name: hype-auctioneer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Point the fan-out at the bidder bots running in the `bots` container.
      SPRING_APPLICATION_JSON: >-
        {"hype":{"auction":{"bidders":[
        "http://bots:9101","http://bots:9102","http://bots:9103","http://bots:9104",
        "http://bots:9105","http://bots:9106","http://bots:9107","http://bots:9108"]}}}
    ports:
      - "8080:8080"

  streams:
    profiles: ["full"]
    build:
      context: .
      target: streams
    container_name: hype-streams
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092

  bots:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    container_name: hype-bots
    command: ["python", "bots/run_bidders.py", "8", "--slow-probability", "0.05"]

  generator:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    container_name: hype-generator
    depends_on:
      auctioneer:
        condition: service_started
      bots:
        condition: service_started
    command: ["python", "gen/firehose.py", "--url", "http://auctioneer:8080/auctions", "--rate", "150", "--duration", "0"]

  dashboard:
    profiles: ["full"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: hype-dashboard
    depends_on:
      auctioneer:
        condition: service_started
    ports:
      - "8088:80"
